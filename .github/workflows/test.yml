name: Comprobar aplicación
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/catalog.test.js test/folder-picker.test.js test/transcription-selection.test.js test/stream-progress.test.js test/vision-response.test.js test/meeting-minutes.test.js test/catalog-storage.test.js test/catalog-startup.test.js test/job-recovery.test.js test/browser-demo.test.mjs
      - name: Empaquetar y verificar la aplicación distribuida
        shell: powershell
        run: |
          .\Empaquetar.ps1
          .\test\verify-package.ps1
      - name: Comprobar iniciador con Windows PowerShell
        shell: powershell
        run: .\Iniciar.ps1 -SoloComprobar
  audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audio.txt
      - run: python -m unittest discover -s test -p "test_*.py"
